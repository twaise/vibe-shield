[project]
name = "vibe-shield"
version = "0.1.0"
description = "Intelligent middleware for VibeMarketolog Agent API — circuit breaker, semantic cache, and cost protection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Maxim Li", email = "gasters684@gmail.com" },
]
keywords = ["vibemarketolog", "ai", "api", "middleware", "circuit-breaker", "cache", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27",
    "aiofiles>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
semantic = [
    "sentence-transformers>=3.0",
]

[project.urls]
Repository = "https://github.com/twaise/vibe-shield"
Issues = "https://github.com/twaise/vibe-shield/issues"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
